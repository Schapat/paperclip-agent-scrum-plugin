# pnpm 11 liest Overrides nicht mehr aus package.json. Ohne diesen Eintrag holt
# pnpm @paperclipai/shared aus der npm-Registry statt aus dem SDK-Snapshot —
# das Plugin-SDK importiert dann Konstanten, die es dort nicht gibt.
overrides:
  "@paperclipai/shared": "file:.paperclip-sdk/paperclipai-shared-0.3.1.tgz"

# esbuild wird über seine JS-API benutzt (esbuild.config.mjs), nicht über die
# CLI. Dafür genügt das plattformspezifische @esbuild/<platform>-Paket; das
# postinstall würde nur bin/esbuild durch die Binärdatei ersetzen und den
# von pnpm erzeugten node-Shim unbrauchbar machen.
allowBuilds:
  esbuild: false
